<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background linear gradient: Emerald / Teal Base -->
    <linearGradient id="uncanny-bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Top-Right warm amber / bronze glow -->
    <radialGradient id="uncanny-amber-glow" cx="84%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom-Left deep cobalt / royal blue glow -->
    <radialGradient id="uncanny-blue-glow" cx="16%" cy="84%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.95" />
      <stop offset="48%" stop-color="#1d4ed8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>

    <!-- Inner ambient shadow / rim -->
    <radialGradient id="uncanny-rim" cx="50%" cy="50%" r="52%">
      <stop offset="75%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </radialGradient>

    <!-- Polygon drop shadow and soft glow -->
    <filter id="poly-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#ffffff" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="3" y="3" width="94" height="94" rx="23" fill="url(#uncanny-bg-base)" />
  <rect x="3" y="3" width="94" height="94" rx="23" fill="url(#uncanny-amber-glow)" />
  <rect x="3" y="3" width="94" height="94" rx="23" fill="url(#uncanny-blue-glow)" />
  <rect x="3" y="3" width="94" height="94" rx="23" fill="url(#uncanny-rim)" />
  <rect x="3.75" y="3.75" width="92.5" height="92.5" rx="22.25" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />

  <!-- 3D Geometric Pentagon Mesh -->
  <g filter="url(#poly-glow)">
    <!-- 3D Translucent Facet Shading -->
    <polygon points="50,50.5 50,25 73.8,42.3" fill="rgba(255, 255, 255, 0.08)" />
    <polygon points="50,50.5 73.8,42.3 64.7,70.2" fill="rgba(255, 255, 255, 0.16)" />
    <polygon points="50,50.5 64.7,70.2 35.3,70.2" fill="rgba(255, 255, 255, 0.04)" />
    <polygon points="50,50.5 35.3,70.2 26.2,42.3" fill="rgba(255, 255, 255, 0.12)" />
    <polygon points="50,50.5 26.2,42.3 50,25" fill="rgba(255, 255, 255, 0.20)" />

    <!-- Outer Pentagon Wireframe -->
    <polygon points="50,25 73.8,42.3 64.7,70.2 35.3,70.2 26.2,42.3" 
             fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Radial Spokes to Center Vertex -->
    <line x1="50" y1="50.5" x2="50" y2="25" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
    <line x1="50" y1="50.5" x2="73.8" y2="42.3" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
    <line x1="50" y1="50.5" x2="64.7" y2="70.2" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
    <line x1="50" y1="50.5" x2="35.3" y2="70.2" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
    <line x1="50" y1="50.5" x2="26.2" y2="42.3" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />

    <!-- Vertex Dots -->
    <circle cx="50" cy="25" r="3.2" fill="#ffffff" />
    <circle cx="73.8" cy="42.3" r="3.2" fill="#ffffff" />
    <circle cx="64.7" cy="70.2" r="3.2" fill="#ffffff" />
    <circle cx="35.3" cy="70.2" r="3.2" fill="#ffffff" />
    <circle cx="26.2" cy="42.3" r="3.2" fill="#ffffff" />
    <circle cx="50" cy="50.5" r="3.6" fill="#ffffff" />
  </g>
</svg>
